name: Guard doc paths

# Agent instruction files accumulated references to files, directories, and
# workflows that had been renamed or removed, because nothing checked them.
# Fail the build when a repo-relative path or a relative markdown link in the
# instruction set stops resolving.
#
# No paths filter: a PR that renames a *target* (package/, test/, a workflow)
# touches none of the doc sources, so filtering on those would skip exactly the
# PRs that break a reference. The check takes seconds, so it runs on every PR.
#
# Known gaps, all deliberate: a path quoted as a bare filename with no
# directory (`package.json`, `playwright.config.ts`) is not resolvable without
# guessing a directory, and the ASCII tree in AGENTS.md is plain text rather
# than backtick spans. Quote the full repo-relative path to get coverage.
# The link check reads inline links only, so a reference-style link
# (`[text][ref]`) goes unchecked, and a `)` inside a target truncates the match
# and reports a resolvable path as broken. Neither form appears in these files.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Resolve paths in instruction files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check backtick-quoted repo paths
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP:-/tmp}/doc-paths.txt"
          missing=0
          # `|| true` below cannot tell "matched nothing" from "source is
          # missing", so check the sources first. Without this, renaming
          # AGENTS.md drops it from the scan and the step still reports
          # success on the remaining half of the references.
          for source in AGENTS.md README.md agents/ conventions/; do
            case "$source" in
              */) [ -d "$source" ] || { echo "::error::missing scan source: $source"; exit 1; };;
              *) [ -f "$source" ] || { echo "::error::missing scan source: $source"; exit 1; };;
            esac
          done
          # `|| true` on the chain: a grep that matches nothing exits 1, and
          # under pipefail that kills the script before it can report anything.
          grep -rhoE '`[^`]+`' AGENTS.md README.md agents/ conventions/ \
            | tr -d '`' \
            | grep -E '^(\.github|\.changeset|\.claude|agents|conventions|package|storybook|test)/' \
            | sed 's:/$::' | sort -u > "$TMP" || true
          while read -r p; do
            # glob patterns describe a shape, not one file
            case "$p" in *"*"*) continue;; esac
            # .claude is gitignored, so it is absent on a fresh checkout.
            # Match the bare directory too — `sed` above stripped its slash.
            case "$p" in .claude|.claude/*) continue;; esac
            if [ ! -e "$p" ]; then
              echo "::error::path does not exist: $p"
              missing=1
            fi
          done < "$TMP"
          echo "checked $(wc -l < "$TMP") quoted paths"
          exit $missing

      - name: Check relative links
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP:-/tmp}/doc-links.txt"
          broken=0
          # `|| true` below cannot tell "matched nothing" from "source is
          # missing", so check the sources first. Without this, renaming
          # AGENTS.md drops it from the scan and the step still reports
          # success on the remaining half of the references.
          for source in AGENTS.md README.md agents/ conventions/; do
            case "$source" in
              */) [ -d "$source" ] || { echo "::error::missing scan source: $source"; exit 1; };;
              *) [ -f "$source" ] || { echo "::error::missing scan source: $source"; exit 1; };;
            esac
          done
          grep -rnoE '\]\([^)]+\)' AGENTS.md README.md agents/ conventions/ > "$TMP" || true
          while IFS= read -r hit; do
            file="${hit%%:*}"
            link=$(printf '%s' "${hit#*:}" | sed -E 's/.*\]\((.*)\)/\1/')
            # external and same-page links have no file to resolve
            case "$link" in http://*|https://*|"#"*|mailto:*) continue;; esac
            # a link may carry a title — [text](path "title")
            link="${link%% *}"
            # strip an anchor so pr.md#section resolves to pr.md
            link="${link%%#*}"
            [ -n "$link" ] || continue
            if [ ! -e "$(dirname "$file")/$link" ]; then
              echo "::error file=$file::broken link: $link"
              broken=1
            fi
          done < "$TMP"
          echo "checked $(wc -l < "$TMP") links"
          exit $broken
