# gate-template-version: 2
# Generated by the security-gate skill (Tier 1). Adapted for yarn-berry.
# Actions are tag-pinned here; Dependabot (github-actions) promotes them to commit SHAs.
name: security-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # runner ships yarn 1, which cannot read the berry lockfile — must precede setup-node cache probe
      - name: Enable corepack (yarn berry)
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "yarn"

      # ===== TIER0: frozen install (lockfile hash verification) =====
      - name: Frozen install
        run: yarn install --immutable
      # ===== /TIER0 =====

      # ===== TIER1: dependency vuln scan =====
      # Secret scanning is delegated to GitHub's native push protection (default-on
      # for public repos at the user level) — no in-CI gitleaks step needed.
      - name: Vulnerability scan
        # Scope to the published package's runtime deps — that is what reaches
        # npm consumers. Dev-tool advisories don't ship; Dependabot bumps those.
        run: yarn workspace react-modern-audio-player npm audit --environment production --severity high
      # ===== /TIER1 =====
