# gate-template-version: 1
# Generated by the security-gate skill (Tier 2). Adapted for yarn-berry.
# Actions are tag-pinned here; Dependabot (github-actions) promotes them to commit SHAs.
name: security-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # ===== TIER2: build isolation + egress control (blocks exfil of stolen secrets) =====
      - uses: step-security/harden-runner@v2 # pin to SHA via Dependabot
        with:
          egress-policy: audit # switch to block after reviewing allowed endpoints
      # ===== /TIER2 =====

      - uses: actions/checkout@v4 # pin to SHA via Dependabot

      - uses: actions/setup-node@v4 # pin to SHA via Dependabot
        with:
          node-version: "20"
          cache: "yarn"

      # ===== TIER0: frozen install (lockfile hash verification) =====
      - name: Frozen install
        run: yarn install --immutable
      # ===== /TIER0 =====

      # ===== TIER1: dependency vuln + secret scan =====
      - name: Vulnerability scan
        # Scope to the published package's runtime deps — that is what reaches
        # npm consumers. Dev-tool advisories don't ship; Dependabot bumps those.
        run: yarn workspace react-modern-audio-player npm audit --environment production --severity high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3 # pin to SHA via Dependabot
      - name: Supply-chain hygiene
        uses: ossf/scorecard-action@v2 # pin to SHA via Dependabot
        with:
          results_file: results.sarif
          results_format: sarif
      # ===== /TIER1 =====

      # ===== TIER2: SBOM generation =====
      - name: SBOM
        uses: anchore/sbom-action@v0 # pin to SHA via Dependabot
      # ===== /TIER2 =====
